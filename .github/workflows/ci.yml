name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system Tcl/Tk и xvfb (для GUI-тестов)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check hideMyLute/ version_info.py
      - name: Tests with coverage
        run: |
          xvfb-run -a pytest --cov=hideMyLute --cov-report=term-missing --cov-fail-under=80

  build:
    name: Build (PyInstaller onefile)
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Bump version for CI build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: python scripts/bump_version.py --commit
      - name: Set version from git tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            python scripts/set_version.py ${{ github.ref_name }}
          } else {
            Write-Host "Нет тега v* — используется версия из исходников"
          }
      - name: Smoke test (версия и roundtrip)
        run: |
          python -m hideMyLute --version
          python -m pytest hideMyLute/tests/ -q -k "cli or roundtrip"
      - name: Build executable
        run: python -m PyInstaller --noconfirm hideMyLute.spec
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hideMyLute.exe
          path: dist/hideMyLute.exe

  release:
    name: Release
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
      - name: Debug — show skipped reason
        if: always()
        run: |
          echo "test status: ${{ job.test.conclusion }}"
          echo "build status: ${{ job.build.conclusion }}"
          echo "github.ref: ${{ github.ref }}"
          echo "github.ref_type: ${{ github.ref_type }}"
      - name: Download executable
        uses: actions/download-artifact@v8
        with:
          name: hideMyLute.exe
          path: dist/
          merge-multiple: true
      - name: Extract changelog section
        id: extract_changelog
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path

          text = Path("hideMyLute/_version.py").read_text(encoding="utf-8")
          major = re.search(r"VERSION_MAJOR: int = (\d+)", text).group(1)
          minor = re.search(r"VERSION_MINOR: int = (\d+)", text).group(1)
          patch = re.search(r"VERSION_PATCH: int = (\d+)", text).group(1)
          version = f"{major}.{minor}.{patch}"

          changelog_text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"## \[{re.escape(version)}\](.*?)(?=\n## \[|\Z)", changelog_text, re.S)
          body = m.group(1).strip() if m else f"Автоматический релиз версии {version}.\n\n_Заметки об изменениях будут добавлены после следующего пуша в main._"
          Path("release_notes.md").write_text(f"## v{version}\n\n{body}\n", encoding="utf-8")
          EOF
          echo "version=$(python -c "import re; text=open('hideMyLute/_version.py').read(); print('.'.join(re.search(r'VERSION_' + n + r': int = (\d+)', text).group(1) for n in ('MAJOR','MINOR','PATCH')))")" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.extract_changelog.outputs.version }}
          files: dist/hideMyLute.exe
          body_path: release_notes.md
